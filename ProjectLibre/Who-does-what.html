<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Does What</title>

    <link rel="stylesheet" href="../style.css">

    <script>
        let pics = [
            "../pildid/Whodoeswhat.png",
            "../pildid/Whodoeswhat2.png",
            "../pildid/whodoeswhat3.png"
        ];

        let currentIndex = 0;

        function showImage(index) {
            const img = document.getElementById("whoPic");
            img.src = pics[index];
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % pics.length;
            showImage(currentIndex);
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + pics.length) % pics.length;
            showImage(currentIndex);
        }

        window.onload = function () {
            showImage(0);
        }
    </script>
</head>

<body>

<header class="hero">
    <h1>Who Does What</h1>
    <p>Projekti rollide ja tööjaotuse ülevaade</p>
</header>

<main class="container">

    <section class="card">
                 <a class="github-btn" href="./index.html">
            ← Tagasi
        </a>
        <h2>Pildigalerii</h2>

        <img id="whoPic"
             alt="Who Does What"
             style="width:100%; height:auto; border-radius:12px; margin-bottom:15px;">

        <div class="links" style="justify-content:center;">
            <a href="#" onclick="showPrev(); return false;">← Previous</a>
            <a href="#" onclick="showNext(); return false;">Next →</a>
        </div>
    </section>


</main>

<footer class="footer">
    <p>Sergei Hüvenen ainemapp © 2025</p>
</footer>

</body>
</html>
